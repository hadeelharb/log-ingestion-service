services:
  app:
    build: .

    ports:
      - "8080:8080"

    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/logs"
      RETENTION_DAYS: "30"
      LOG_REQUESTS: "false"

    depends_on:
      db:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  db:
    image: postgres:17
    restart: always

    command:
      - postgres
      - -c
      - jit=off

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs"]
      interval: 5s
      timeout: 5s
      retries: 10

    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

volumes:
  postgres_data:
